      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: One line on what it is and what it is for (max. 200 characters).
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: "Owner"
      description: GitHub user or team to contact about it (optional).
