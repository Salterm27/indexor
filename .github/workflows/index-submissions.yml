name: index-submissions

# Turns each valid submission issue into a pull request that adds the entry.
# Merging the pull request is the approval: it publishes the entry and
# closes the issue.
on:
  issues:
    types: [opened, edited, reopened]
  # When main changes, open submission pull requests are rebuilt on top of it
  # so they never conflict with each other.
  push:
    branches: [main]
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

# One at a time: every run may rewrite submission branches.
concurrency:
  group: index-submissions
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  BASE: ${{ github.event.repository.default_branch }}

jobs:
  propose:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      EVENT: ${{ github.event_name }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Issue content is fetched as JSON and only ever read by the tool; it
      # is never interpolated into the shell.
      - name: Open or refresh submission pull requests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          output=$(python3 -c "import json; print(json.load(open('indexor.config.json'))['output'])")

          if [ "$EVENT" = "issues" ]; then
            numbers="$ISSUE"
          else
            numbers=$(gh pr list --state open --limit 200 --json headRefName \
              --jq '.[].headRefName | select(startswith("submission/issue-")) | ltrimstr("submission/issue-")')
          fi

          for n in $numbers; do
            case "$n" in *[!0-9]*|"") continue ;; esac
            branch="submission/issue-$n"
            issue="$RUNNER_TEMP/issue-$n.json"
            report="$RUNNER_TEMP/report-$n.md"
            git checkout -q --detach "origin/$BASE"
            git clean -fdq

            gh api "repos/$GH_REPO/issues/$n" > "$issue"
            [ "$(jq -r .state "$issue")" = "open" ] || continue
            state=$(tools/indexor review "$issue" --write --report "$report")
            [ "$state" != "unrelated" ] || continue

            gh label create submission --color 1d76db --description "Request to add a repository to the index" --force >/dev/null
            gh label create invalid    --color d93f0b --description "The submission needs changes" --force >/dev/null
            gh label create published  --color 5319e7 --description "Already in the index" --force >/dev/null

            pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')

            if [ "$state" = "valid" ]; then
              tools/indexor lint
              git add data "$output"
              git commit -q -m "Add submission #$n to the index"
              git push -q --force origin "HEAD:refs/heads/$branch"
              if [ -z "$pr" ]; then
                gh pr create --head "$branch" --base "$BASE" \
                  --title "$(tools/indexor title "$issue")" \
                  --body "Adds the repository submitted in #$n. Merging publishes it to the index.

          Closes #$n" >/dev/null
                pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
              fi
              printf '\nPull request: #%s\n' "$pr" >> "$report"
              gh issue edit "$n" --add-label submission --remove-label invalid >/dev/null
            else
              if [ -n "$pr" ]; then
                gh pr close "$pr" --delete-branch --comment "The submission in #$n is no longer valid." >/dev/null
              fi
              gh issue edit "$n" --add-label submission,invalid >/dev/null
            fi

            # On a rebuild, only speak up if something changed for the worse.
            if [ "$EVENT" = "issues" ] || [ "$state" = "invalid" ]; then
              gh issue comment "$n" --edit-last --body-file "$report" >/dev/null 2>&1 \
                || gh issue comment "$n" --body-file "$report" >/dev/null
            fi
          done

  published:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.merged &&
      startsWith(github.event.pull_request.head.ref, 'submission/issue-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.event.pull_request.head.ref }}
      MERGER: ${{ github.event.pull_request.merged_by.login }}
    steps:
      - name: Mark the submission as published
        run: |
          n="${BRANCH#submission/issue-}"
          case "$n" in *[!0-9]*|"") exit 0 ;; esac
          gh issue edit "$n" --add-label published
          gh issue comment "$n" --body "### 🚀 Published

          This repository is now in the index. Approved by @$MERGER."
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH" || true
