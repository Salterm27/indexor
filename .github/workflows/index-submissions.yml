name: index-submissions

# Turns each valid submission or removal issue into a pull request that adds
# or deletes the entry. Merging the pull request is the approval: it applies
# the change and closes the issue.
on:
  issues:
    types: [opened, edited, reopened, closed]
  # When main changes, open submission pull requests are rebuilt on top of it
  # so they never conflict with each other.
  push:
    branches: [main]
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  BASE: ${{ github.event.repository.default_branch }}

jobs:
  # An issue was opened, edited, reopened or closed.
  propose:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    # GitHub keeps only one waiting run per group, so the group is per issue:
    # the latest event for an issue wins.
    concurrency:
      group: index-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      n: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Issue content is fetched as JSON and only ever read by the tool; it
      # is never interpolated into the shell.
      - name: Open a pull request for the request
        run: |
          set -euo pipefail
          branch="index/issue-$n"
          issue="$RUNNER_TEMP/issue.json"
          report="$RUNNER_TEMP/report.md"
          comment() {
            gh issue comment "$n" --edit-last --body-file "$report" >/dev/null 2>&1 \
              || gh issue comment "$n" --body-file "$report" >/dev/null
          }

          gh api "repos/$GH_REPO/issues/$n" > "$issue"
          kind=$(python3 tools/indexor kind "$issue")
          [ "$kind" != "unrelated" ] || exit 0
          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')

          # Closing the issue withdraws the request.
          if [ "$(jq -r .state "$issue")" != "open" ]; then
            if [ -n "$pr" ]; then
              gh pr close "$pr" --delete-branch --comment "Issue #$n was closed, so this request is withdrawn." >/dev/null
            fi
            exit 0
          fi

          # Once a pull request exists it is frozen: what a maintainer reviewed
          # is what gets merged, whatever happens to the issue afterwards.
          if [ -n "$pr" ]; then
            printf '### 🔒 This request is locked\n\nPull request #%s was opened from an earlier version of this issue, and later edits are not applied to it.\n\nTo change the request, close this issue and open a new one.\n' "$pr" > "$report"
            comment
            exit 0
          fi

          gh label create submission --color 1d76db --description "Request to add a repository to the index" --force >/dev/null
          gh label create removal    --color fbca04 --description "Request to remove a repository from the index" --force >/dev/null
          gh label create invalid    --color d93f0b --description "The request needs changes" --force >/dev/null
          gh label create published  --color 5319e7 --description "Already in the index" --force >/dev/null
          gh label create removed    --color 6a737d --description "Taken out of the index" --force >/dev/null

          if [ "$kind" = "removal" ]; then
            message="Remove the entry requested in #$n"
            body="Removes the repository named in #$n. Merging takes it out of the index."
          else
            message="Add submission #$n to the index"
            body="Adds the repository submitted in #$n. Merging publishes it to the index."
          fi

          # The title is read before the change is applied, while a removed
          # entry's name is still on disk.
          title=$(python3 tools/indexor title "$issue" 2>/dev/null || true)
          state=$(python3 tools/indexor review "$issue" --write --report "$report")

          if [ "$state" = "valid" ]; then
            python3 tools/indexor lint
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "$message"
            git push -q --force origin "HEAD:refs/heads/$branch"
            gh pr create --head "$branch" --base "$BASE" --title "$title" \
              --body "$body

          This pull request is frozen: later edits to the issue do not change it.

          Closes #$n" >/dev/null
            pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
            printf '\nPull request: #%s. The request is now locked; to change it, close this issue and open a new one.\n' "$pr" >> "$report"
            gh issue edit "$n" --add-label "$kind" --remove-label invalid >/dev/null
          else
            gh issue edit "$n" --add-label "$kind,invalid" >/dev/null
          fi
          comment

  # main changed: replay every open request on top of it, so pending pull
  # requests never conflict with each other.
  rebuild:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: index-rebuild
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      # The change is replayed from the pull request branch itself, never
      # from the issue, so a rebuild cannot pick up later edits.
      - name: Rebuild open request pull requests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          gh pr list --state open --limit 200 --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("index/issue-")) | "\(.number) \(.headRefName)"' \
            > "$RUNNER_TEMP/open.txt"

          while read -r pr branch; do
            n="${branch#index/issue-}"
            case "$n" in *[!0-9]*|"") continue ;; esac
            git fetch -q origin "refs/heads/$branch"
            old=$(git rev-parse FETCH_HEAD)
            git checkout -q --detach "origin/$BASE"
            git clean -fdq

            # Replay the entry files the request added or deleted.
            stale=""
            git diff --name-status "origin/$BASE...$old" -- data/entries > "$RUNNER_TEMP/changes.txt"
            while read -r status path; do
              case "$status" in
                D) if [ -e "$path" ]; then rm -f -- "$path"; else stale=yes; fi ;;
                *) if [ -e "$path" ]; then stale=yes; else git show "$old:$path" > "$path"; fi ;;
              esac
            done < "$RUNNER_TEMP/changes.txt"
            [ -s "$RUNNER_TEMP/changes.txt" ] || stale=yes
            python3 tools/indexor build >/dev/null
            python3 tools/indexor lint >/dev/null || stale=yes

            if [ -n "$stale" ]; then
              gh pr close "$pr" --delete-branch --comment "The index changed and this request no longer applies." >/dev/null
              gh issue edit "$n" --add-label invalid >/dev/null
              gh issue comment "$n" --body "### ❌ This request no longer applies

          The index changed after pull request #$pr was opened (for example, the same repository was added or removed by another request), so it was closed. Open a new request if it is still needed." >/dev/null
              continue
            fi

            git add -A
            git commit -q -m "$(git log -1 --format=%s "$old")"
            git push -q --force origin "HEAD:refs/heads/$branch"
          done < "$RUNNER_TEMP/open.txt"

  published:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.merged &&
      startsWith(github.event.pull_request.head.ref, 'index/issue-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.event.pull_request.head.ref }}
      MERGER: ${{ github.event.pull_request.merged_by.login }}
    steps:
      - name: Mark the request as done
        run: |
          n="${BRANCH#index/issue-}"
          case "$n" in *[!0-9]*|"") exit 0 ;; esac
          if gh api "repos/$GH_REPO/issues/$n" --jq '.labels[].name' | grep -qx removal; then
            gh issue edit "$n" --add-label removed
            gh issue comment "$n" --body "### 🗑️ Removed

          This repository is no longer in the index. Approved by @$MERGER."
          else
            gh issue edit "$n" --add-label published
            gh issue comment "$n" --body "### 🚀 Published

          This repository is now in the index. Approved by @$MERGER."
          fi
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH" || true
