name: index-submissions

# Turns each valid submission or removal issue into a pull request that adds
# or deletes the entry. Merging the pull request is the approval: it applies
# the change and closes the issue.
on:
  issues:
    types: [opened, edited, reopened]
  # When main changes, open submission pull requests are rebuilt on top of it
  # so they never conflict with each other.
  push:
    branches: [main]
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  BASE: ${{ github.event.repository.default_branch }}

jobs:
  propose:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # GitHub keeps only one waiting run per group, so the group is per issue
    # (the latest edit wins) and one for rebuilds (the latest main wins).
    concurrency:
      group: index-submissions-${{ github.event.issue.number || 'rebuild' }}
      cancel-in-progress: false
    env:
      EVENT: ${{ github.event_name }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Issue content is fetched as JSON and only ever read by the tool; it
      # is never interpolated into the shell.
      - name: Open or refresh submission pull requests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          output=$(python3 -c "import json; print(json.load(open('indexor.config.json'))['output'])")

          if [ "$EVENT" = "issues" ]; then
            numbers="$ISSUE"
          else
            numbers=$(gh pr list --state open --limit 200 --json headRefName \
              --jq '.[].headRefName | select(startswith("index/issue-")) | ltrimstr("index/issue-")')
          fi

          for n in $numbers; do
            case "$n" in *[!0-9]*|"") continue ;; esac
            branch="index/issue-$n"
            issue="$RUNNER_TEMP/issue-$n.json"
            report="$RUNNER_TEMP/report-$n.md"
            git checkout -q --detach "origin/$BASE"
            git clean -fdq

            gh api "repos/$GH_REPO/issues/$n" > "$issue"
            [ "$(jq -r .state "$issue")" = "open" ] || continue
            # The title is read before the change is applied, while a removed
            # entry's name is still on disk.
            title=$(tools/indexor title "$issue" 2>/dev/null || true)
            state=$(tools/indexor review "$issue" --write --report "$report")
            [ "$state" != "unrelated" ] || continue
            kind=$(tools/indexor kind "$issue")
            if [ "$kind" = "removal" ]; then
              message="Remove the entry requested in #$n"
              body="Removes the repository named in #$n. Merging takes it out of the index."
            else
              message="Add submission #$n to the index"
              body="Adds the repository submitted in #$n. Merging publishes it to the index."
            fi

            gh label create submission --color 1d76db --description "Request to add a repository to the index" --force >/dev/null
            gh label create invalid    --color d93f0b --description "The submission needs changes" --force >/dev/null
            gh label create removal    --color fbca04 --description "Request to remove a repository from the index" --force >/dev/null
            gh label create published  --color 5319e7 --description "Already in the index" --force >/dev/null
            gh label create removed    --color 6a737d --description "Taken out of the index" --force >/dev/null

            pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')

            if [ "$state" = "valid" ]; then
              tools/indexor lint
              git add -A data "$output"
              git commit -q -m "$message"
              git push -q --force origin "HEAD:refs/heads/$branch"
              if [ -z "$pr" ]; then
                gh pr create --head "$branch" --base "$BASE" \
                  --title "$title" \
                  --body "$body

          Closes #$n" >/dev/null
                pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
              fi
              printf '\nPull request: #%s\n' "$pr" >> "$report"
              gh issue edit "$n" --add-label "$kind" --remove-label invalid >/dev/null
            else
              if [ -n "$pr" ]; then
                gh pr close "$pr" --delete-branch --comment "The request in #$n is no longer valid." >/dev/null
              fi
              gh issue edit "$n" --add-label "$kind,invalid" >/dev/null
            fi

            # On a rebuild, only speak up if something changed for the worse.
            if [ "$EVENT" = "issues" ] || [ "$state" = "invalid" ]; then
              gh issue comment "$n" --edit-last --body-file "$report" >/dev/null 2>&1 \
                || gh issue comment "$n" --body-file "$report" >/dev/null
            fi
          done

  published:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.merged &&
      startsWith(github.event.pull_request.head.ref, 'index/issue-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.event.pull_request.head.ref }}
      MERGER: ${{ github.event.pull_request.merged_by.login }}
    steps:
      - name: Mark the request as done
        run: |
          n="${BRANCH#index/issue-}"
          case "$n" in *[!0-9]*|"") exit 0 ;; esac
          if gh api "repos/$GH_REPO/issues/$n" --jq '.labels[].name' | grep -qx removal; then
            gh issue edit "$n" --add-label removed
            gh issue comment "$n" --body "### 🗑️ Removed

          This repository is no longer in the index. Approved by @$MERGER."
          else
            gh issue edit "$n" --add-label published
            gh issue comment "$n" --body "### 🚀 Published

          This repository is now in the index. Approved by @$MERGER."
          fi
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH" || true
