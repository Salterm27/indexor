name: index-lint

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the tests
        run: python3 -m unittest discover -s tests

      - name: Validate config, entries and generated files
        run: python3 tools/indexor lint

      - name: Check the site builds
        run: |
          python3 tools/indexor site /tmp/site-check
          python3 -c "import json; json.load(open('/tmp/site-check/index.json'))"
