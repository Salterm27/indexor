name: index-lint

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate config, entries and generated files
        run: tools/indexor lint

      - name: Check the site builds
        run: |
          tools/indexor site /tmp/site-check
          python3 -c "import json; json.load(open('/tmp/site-check/index.json'))"
