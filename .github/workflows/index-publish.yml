name: index-publish

# When an approver adds the `approved` label to a submission, this adds the
# entry to the index, regenerates the .md, closes the issue and deploys the
# site.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

# Publications run one at a time so their commits do not collide.
concurrency:
  group: index-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.label.name == 'approved' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.commit.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      APPROVER: ${{ github.event.sender.login }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check the approver is authorised
        id: permission
        run: |
          role=$(gh api "repos/$GH_REPO/collaborators/$APPROVER/permission" --jq .role_name)
          if tools/indexor authorized "$APPROVER" "$role"; then
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          else
            gh issue edit "$ISSUE" --remove-label approved
            gh issue comment "$ISSUE" --body "⛔ @$APPROVER is not authorised to approve submissions. The \`approved\` label was removed."
          fi

      - name: Add the entry to the index
        id: add
        if: steps.permission.outputs.ok == 'yes'
        run: |
          if tools/indexor publish "$GITHUB_EVENT_PATH" --approver "$APPROVER" --report report.md; then
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          else
            gh issue edit "$ISSUE" --remove-label approved --add-label invalid
            gh issue comment "$ISSUE" --body-file report.md
          fi

      - name: Commit and publish
        id: commit
        if: steps.add.outputs.ok == 'yes'
        run: |
          tools/indexor lint
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data "$(python3 -c "import json;print(json.load(open('indexor.config.json'))['output'])")"
          git commit -m "feat(index): add #$ISSUE, approved by $APPROVER"
          git push
          gh issue comment "$ISSUE" --body-file report.md
          gh issue edit "$ISSUE" --add-label published
          gh issue close "$ISSUE" --reason completed
          echo "published=yes" >> "$GITHUB_OUTPUT"

  # A push made with the GITHUB_TOKEN does not trigger other workflows, so
  # the site deployment is chained here.
  site:
    needs: publish
    if: needs.publish.outputs.published == 'yes'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/index-pages.yml
