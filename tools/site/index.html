<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="title">Index</h1>
  <p id="description"></p>
  <div class="barra">
    <input id="search" type="search" placeholder="Search repositories…" aria-label="Search">
    <a id="submit" class="button" hidden>Submit a repository</a>
  </div>
  <nav id="toc" aria-label="Sections"></nav>
</header>
<main id="sections"></main>
<script>
const el = (tag, props = {}, ...children) => {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...children);
  return n;
};
fetch("index.json").then(r => r.json()).then(d => {
  document.title = d.title;
  document.getElementById("title").textContent = d.title;
  document.getElementById("description").textContent = d.description;
  if (d.repo) {
    const a = document.getElementById("submit");
    a.href = `https://github.com/${d.repo}/issues/new?template=submission.yml`;
    a.hidden = false;
  }
  const toc = document.getElementById("toc"), main = document.getElementById("sections");
  const paint = filter => {
    toc.replaceChildren(); main.replaceChildren();
    for (const s of d.sections) {
      const items = d.entries
        .filter(e => e.section === s.id)
        .filter(e => (e.name + " " + e.description + " " + e.owner).toLowerCase().includes(filter))
        .sort((a, b) => a.name.localeCompare(b.name));
      toc.append(el("a", { href: "#" + s.id, textContent: `${s.name} (${items.length})` }));
      const sec = el("section", { id: s.id }, el("h2", { textContent: s.name }));
      if (s.description) sec.append(el("p", { className: "muted", textContent: s.description }));
      if (!items.length) sec.append(el("p", { className: "muted", textContent: "No repositories." }));
      const ul = el("ul");
      for (const e of items) {
        // Only https URLs are linked: the content comes from third-party issues.
        const a = el("a", { textContent: e.name, rel: "noopener" });
        if (/^https:\/\//.test(e.url)) a.href = e.url;
        const li = el("li", {}, a, el("p", { textContent: e.description }));
        if (e.owner) li.append(el("span", { className: "muted", textContent: e.owner }));
        ul.append(li);
      }
      sec.append(ul); main.append(sec);
    }
  };
  paint("");
  document.getElementById("search").addEventListener("input", ev => paint(ev.target.value.trim().toLowerCase()));
});
</script>
</body>
</html>
