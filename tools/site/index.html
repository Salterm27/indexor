<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Índice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="titulo">Índice</h1>
  <p id="descripcion"></p>
  <div class="barra">
    <input id="buscar" type="search" placeholder="Buscar repositorio…" aria-label="Buscar">
    <a id="alta" class="boton" hidden>Proponer un repositorio</a>
  </div>
  <nav id="toc" aria-label="Secciones"></nav>
</header>
<main id="secciones"></main>
<script>
const el = (tag, props = {}, ...hijos) => {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...hijos);
  return n;
};
fetch("indice.json").then(r => r.json()).then(d => {
  document.title = d.titulo;
  document.getElementById("titulo").textContent = d.titulo;
  document.getElementById("descripcion").textContent = d.descripcion;
  if (d.repo) {
    const a = document.getElementById("alta");
    a.href = `https://github.com/${d.repo}/issues/new?template=alta.yml`;
    a.hidden = false;
  }
  const toc = document.getElementById("toc"), main = document.getElementById("secciones");
  const pintar = filtro => {
    toc.replaceChildren(); main.replaceChildren();
    for (const s of d.secciones) {
      const items = d.entradas
        .filter(e => e.seccion === s.id)
        .filter(e => (e.nombre + " " + e.descripcion + " " + e.responsable).toLowerCase().includes(filtro))
        .sort((a, b) => a.nombre.localeCompare(b.nombre));
      toc.append(el("a", { href: "#" + s.id, textContent: `${s.nombre} (${items.length})` }));
      const sec = el("section", { id: s.id }, el("h2", { textContent: s.nombre }));
      if (s.descripcion) sec.append(el("p", { className: "tenue", textContent: s.descripcion }));
      if (!items.length) sec.append(el("p", { className: "tenue", textContent: "Sin repositorios." }));
      const ul = el("ul");
      for (const e of items) {
        // Solo se enlazan URLs https: el contenido viene de issues de terceros.
        const a = el("a", { textContent: e.nombre, rel: "noopener" });
        if (/^https:\/\//.test(e.url)) a.href = e.url;
        const li = el("li", {}, a, el("p", { textContent: e.descripcion }));
        if (e.responsable) li.append(el("span", { className: "tenue", textContent: e.responsable }));
        ul.append(li);
      }
      sec.append(ul); main.append(sec);
    }
  };
  pintar("");
  document.getElementById("buscar").addEventListener("input", ev => pintar(ev.target.value.trim().toLowerCase()));
});
</script>
</body>
</html>
