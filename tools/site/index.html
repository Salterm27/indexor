<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="masthead">
  <div>
    <h1 id="title">Index</h1>
    <p id="description" class="lede"></p>
  </div>
  <a id="add" class="add" hidden>
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Add a repository
  </a>
</header>

<div class="layout">
  <aside>
    <label class="search">
      <span class="sr">Search repositories</span>
      <input id="search" type="search" placeholder="Search" autocomplete="off">
    </label>
    <nav id="toc" aria-label="Sections"></nav>
  </aside>
  <main id="sections"></main>
</div>

<script src="app.js"></script>
</body>
</html>
